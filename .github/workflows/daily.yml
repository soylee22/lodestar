name: Lodestar performance update

on:
  schedule:
    # 07:17 UTC on weekdays (off the top-of-hour queue spike). Rebuilds the
    # public page first and then dispatches Telegram and HTML email from the
    # exact same snapshot so all three channels stay synchronised.
    - cron: '17 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: lodestar-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Rebuild public page and shared signal snapshot
        run: python run_monthly.py --build-only

      - name: Push synchronised public data
        run: |
          git config user.name  "soylee22"
          git config user.email "leeslater1992@gmail.com"
          for p in data.js data/live_portfolio.json data/emerging.json data/crash_protection.json \
                   data/panel_local.csv data/last_alert.json data/holdings.json data/signal_history.json \
                   data/fund_prices_gbp.csv data/track_record.csv data/price_status.json data/company_logos.json \
                   data/final_index_tr.csv data/final_index_price.csv assets/company-logos; do
            if [ -e "$p" ] && ! git check-ignore -q "$p"; then
              git add "$p"
            fi
          done
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "refresh: $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Verify private broker connection
        env:
          T212_KEY_ID: ${{ secrets.T212_KEY_ID }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
        run: python -m pipeline.broker

      - name: Private performance and signal report
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          T212_KEY_ID: ${{ secrets.T212_KEY_ID }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
        run: python daily.py --snapshot

      - name: Notify job failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python cloud_alerts.py failure
