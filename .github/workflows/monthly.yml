name: Monthly signal and page refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly.yml'
      - 'pipeline/**'
      - 'tests/**'
      - 'build_data.py'
      - 'run_monthly.py'
      - 'requirements.txt'
      - 'universe.py'
      - 'index.html'
      - 'notify.py'
      - 'mailer.py'
  schedule:
    # Refresh daily off the top-of-hour queue spike so delayed month-end prices
    # and monthly signal transitions are caught cleanly before daily reports.
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      send_alerts:
        description: Send the monthly alert if it has not already been sent
        type: boolean
        default: false

concurrency:
  group: lodestar-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the signal and book regressions
        run: python -m unittest discover -s tests

      - name: Recompute signal and rebuild the page
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BUILD_ONLY: ${{ github.event_name != 'schedule' && !inputs.send_alerts }}
        run: |
          if [ "$BUILD_ONLY" = "true" ]; then
            python run_monthly.py --build-only
          else
            python run_monthly.py
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "soylee22"
          git config user.email "leeslater1992@gmail.com"
          for p in data.js data/live_portfolio.json data/emerging.json data/crash_protection.json \
                   data/panel_local.csv data/last_alert.json data/holdings.json data/signal_history.json \
                   data/fund_prices_gbp.csv data/track_record.csv data/price_status.json data/company_logos.json \
                   data/final_index_tr.csv data/final_index_price.csv assets/company-logos; do
            if [ -e "$p" ] && ! git check-ignore -q "$p"; then
              git add "$p"
            fi
          done
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "refresh: $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Notify job failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python cloud_alerts.py failure
