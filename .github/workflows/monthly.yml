name: Monthly signal and page refresh

on:
  schedule:
    # Refresh daily so delayed month-end prices are picked up after the 5th too.
    # Signals are archived. Alerts remain once per signal month.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      send_alerts:
        description: Send the monthly alert if it has not already been sent
        type: boolean
        default: false

concurrency:
  group: lodestar-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the signal and book regressions
        run: python -m unittest discover -s tests

      - name: Recompute signal and rebuild the page
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.send_alerts }}
        run: |
          if [ "$BUILD_ONLY" = "true" ]; then
            python run_monthly.py --build-only
          else
            python run_monthly.py
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "soylee22"
          git config user.email "leeslater1992@gmail.com"
          git add data.js data/panel_local.csv data/last_alert.json data/holdings.json data/signal_history.json data/fund_prices_gbp.csv data/track_record.csv
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "refresh: $(date +%Y-%m-%d)"
            git push
          fi
